name: FAFB v783 Gate C0 arbor-aware spatial preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_fafb_arbor_spatial_preflight.py"
      - "src/graph/connections.py"
      - ".github/workflows/m2-fafb-arbor-spatial-preflight.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download FAFB v783 connections
        run: |
          mkdir -p data/raw/fafb_v783
          curl -L --fail --retry 3 --retry-all-errors             --output data/raw/fafb_v783/connections_princeton.csv.gz             "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"

      - name: Download FAFB v783 synapse coordinates
        run: |
          curl -L --fail --retry 3 --retry-all-errors             --output data/raw/fafb_v783/synapse_coordinates.csv.gz             "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/synapse_coordinates.csv.gz"

      - name: Verify synapse-coordinate schema and run C0
        env:
          PYTHONPATH: .
        run: |
          gzip -cd data/raw/fafb_v783/synapse_coordinates.csv.gz | head -c 4096
          echo
          /usr/bin/time -v python scripts/run_fafb_arbor_spatial_preflight.py             --min-synapses 5             --edge-sample 100000             --nonedge-sample 100000             --seed 20260927

      - name: Upload C0 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-gate-c0-arbor-spatial-preflight
          path: artifacts/fafb-v783/arbor-*
          if-no-files-found: error
