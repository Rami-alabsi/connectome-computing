name: FAFB v783 Gate C1 spatial swap feasibility benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/m2-fafb-c1-spatial-benchmark.yml"
      - "scripts/run_fafb_spatial_swap_benchmark.py"
      - "src/graph/connections.py"
permissions:
  actions: read
  contents: read
jobs:
  benchmark:
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Download graph
        run: |
          mkdir -p data/raw/fafb_v783 artifacts/fafb-v783
          curl -L --fail --retry 3 --retry-all-errors -o data/raw/fafb_v783/connections_princeton.csv.gz "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Download latest validated C0 centroid artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36315995364
          artifact-ids: 10930278435
          path: data/raw/fafb_v783/c0-artifact

      - name: Run feasibility benchmark
        env: {PYTHONPATH: .}
        run: |
          python scripts/run_fafb_spatial_swap_benchmark.py             --connections data/raw/fafb_v783/connections_princeton.csv.gz             --centroids data/raw/fafb_v783/c0-artifact/arbor-centroids.csv.gz             --attempts 100000 --seed 20260927             --output artifacts/fafb-v783/c1-spatial-swap-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-gate-c1-spatial-swap-benchmark
          path: artifacts/fafb-v783/c1-spatial-swap-benchmark.json
