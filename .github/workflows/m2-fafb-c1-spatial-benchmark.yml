name: FAFB v783 Gate C1 spatial swap feasibility benchmark
on:
  workflow_dispatch:
    inputs:
      c0_run_id:
        description: "Authoritative C0 workflow run ID"
        required: true
        type: string
  workflow_run:
    workflows: ["FAFB v783 Gate C0 Princeton arbor spatial preflight"]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  benchmark:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Download graph
        run: |
          mkdir -p data/raw/fafb_v783 artifacts/fafb-v783
          curl -L --fail --retry 3 --retry-all-errors -o data/raw/fafb_v783/connections_princeton.csv.gz "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Download latest validated C0 centroid artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.c0_run_id }}
          name: fafb-v783-gate-c0-princeton-arbor-spatial-preflight
          path: data/raw/fafb_v783/c0-artifact

      - name: Run feasibility benchmark
        env: {PYTHONPATH: .}
        run: |
          python scripts/run_fafb_spatial_swap_benchmark.py             --connections data/raw/fafb_v783/connections_princeton.csv.gz             --centroids "$(find data/raw/fafb_v783 -name arbor-centroids.csv.gz -print -quit)"             --attempts 100000 --seed 20260927             --output artifacts/fafb-v783/c1-spatial-swap-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-gate-c1-spatial-swap-benchmark
          path: artifacts/fafb-v783/c1-spatial-swap-benchmark.json
