name: FAFB v783 Gate C spatial preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_fafb_spatial_preflight.py"
      - "src/graph/connections.py"
      - ".github/workflows/m2-fafb-spatial-preflight.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download FAFB v783 connections
        run: |
          mkdir -p data/raw/fafb_v783
          curl -L --fail --retry 3 --output data/raw/fafb_v783/connections_princeton.csv.gz             "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Download FAFB v783 marked neuron coordinates
        run: |
          curl -L --fail --retry 3 --output data/raw/fafb_v783/coordinates.csv.gz             "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/coordinates.csv.gz"
      - name: Run spatial preflight
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v python scripts/run_fafb_spatial_preflight.py             --min-synapses 5             --edge-sample 100000             --nonedge-sample 100000             --seed 20260927
      - name: Upload preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-gate-c-spatial-preflight
          path: artifacts/fafb-v783/spatial-preflight.json
          if-no-files-found: error
