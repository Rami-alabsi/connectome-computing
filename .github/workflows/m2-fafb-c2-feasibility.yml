name: FAFB v783 C2 NPC-spatial feasibility pilot

on:
  push:
    paths:
      - scripts/run_fafb_npc_spatial_feasibility.py
  workflow_dispatch:
    inputs:
      c0_run_id:
        description: "Authoritative C0 workflow run ID"
        required: true
        type: string

env:
  BOOTSTRAP_C0_RUN_ID: "36318477728"

permissions:
  actions: read
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download graph
        run: |
          mkdir -p data/raw/fafb_v783 artifacts/fafb-v783
          curl -L --fail --retry 3 --retry-all-errors             -o data/raw/fafb_v783/connections_princeton.csv.gz             "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Download authoritative C0 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'push' && env.BOOTSTRAP_C0_RUN_ID || inputs.c0_run_id }}
          name: fafb-v783-gate-c0-princeton-arbor-spatial-preflight
          path: data/raw/fafb_v783/c0-artifact
      - name: Run 100k feasibility pilot
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_fafb_npc_spatial_feasibility.py             --connections data/raw/fafb_v783/connections_princeton.csv.gz             --centroids "$(find data/raw/fafb_v783/c0-artifact -name arbor-centroids.csv.gz -print -quit)"             --seed 20260935             --attempts 100000             --min-synapses 5             --output artifacts/fafb-v783/c2-feasibility-100k.json
      - uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-c2-feasibility-100k
          path: artifacts/fafb-v783/c2-feasibility-100k.json
          retention-days: 90
