name: FAFB v783 C2 NPC-spatial feasibility benchmark

on:
  workflow_dispatch:
    inputs:
      c0_run_id:
        description: "Authoritative C0 workflow run ID"
        required: true
        type: string
      attempts:
        description: "Maximum proposal attempts; ignored as stop condition when target_accepted is reached"
        required: true
        default: "1000000"
        type: string
      target_accepted:
        description: "Stop after this many accepted swaps; use 3732460 for the full C2 null"
        required: true
        default: "3732460"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax preflight
        run: python -m compileall -q scripts src tests
      - name: Pytest collection preflight
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest --collect-only -q
      - name: Download graph
        run: |
          mkdir -p data/raw/fafb_v783 artifacts/fafb-v783
          curl -L --fail --retry 3 --retry-all-errors -o data/raw/fafb_v783/connections_princeton.csv.gz "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Download authoritative C0 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.c0_run_id }}
          name: fafb-v783-gate-c0-princeton-arbor-spatial-preflight
          path: data/raw/fafb_v783/c0-artifact
      - name: Run C2 feasibility benchmark
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_fafb_npc_spatial_feasibility.py --connections data/raw/fafb_v783/connections_princeton.csv.gz --centroids "$(find data/raw/fafb_v783/c0-artifact -name arbor-centroids.csv.gz -print -quit)" --seed 20260935 --attempts ${{ inputs.attempts }} --target-accepted ${{ inputs.target_accepted }} --min-synapses 5 --output artifacts/fafb-v783/c2-feasibility-${{ inputs.attempts }}.json
      - name: Upload C2 result and latest checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-c2-feasibility-${{ inputs.attempts }}
          path: |
            artifacts/fafb-v783/c2-feasibility-${{ inputs.attempts }}.json
            artifacts/fafb-v783/c2-state.pkl.gz
          if-no-files-found: warn
          retention-days: 90
