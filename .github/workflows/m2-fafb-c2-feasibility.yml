name: FAFB v783 C2 NPC-spatial feasibility benchmark

on:
  workflow_dispatch:
    inputs:
      c0_run_id:
        description: "Authoritative C0 workflow run ID"
        required: true
        type: string
      attempts:
        description: "Maximum proposal attempts; ignored as stop condition when target_accepted is reached"
        required: true
        default: "1000000"
        type: string
      target_accepted:
        description: "Stop after this many accepted swaps; use 3732460 for the full C2 null"
        required: true
        default: "3732460"
        type: string
      resume_run_id:
        description: "Optional prior workflow run ID containing a C2 checkpoint artifact"
        required: false
        default: ""
        type: string
      resume_artifact_name:
        description: "Optional prior artifact name containing c2-state.pkl.gz"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax preflight
        run: python -m compileall -q scripts src tests
      - name: Pytest collection preflight
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest --collect-only -q
      - name: Download graph
        run: |
          mkdir -p data/raw/fafb_v783 artifacts/fafb-v783
          curl -L --fail --retry 3 --retry-all-errors -o data/raw/fafb_v783/connections_princeton.csv.gz "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Download authoritative C0 artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.c0_run_id }}
          name: fafb-v783-gate-c0-princeton-arbor-spatial-preflight
          path: data/raw/fafb_v783/c0-artifact
      - name: Download optional C2 resume checkpoint
        if: ${{ inputs.resume_run_id != '' && inputs.resume_artifact_name != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
          name: ${{ inputs.resume_artifact_name }}
          path: artifacts/fafb-v783/c2-resume

      - name: Run C2 feasibility benchmark
        env:
          PYTHONPATH: .
        run: |
          mkdir -p artifacts/fafb-v783/c2-resume
          RESUME_STATE="$(find artifacts/fafb-v783/c2-resume -name c2-state.pkl.gz -print -quit)"
          RESUME_ARG=""
          if [ -n "$RESUME_STATE" ]; then RESUME_ARG="--resume-state $RESUME_STATE"; fi
          CODE_VERSION="$(sha256sum scripts/run_fafb_npc_spatial_feasibility.py | cut -d" " -f1)"
          CENTROIDS="$(find data/raw/fafb_v783/c0-artifact -name arbor-centroids.csv.gz -print -quit)"
          INPUT_FINGERPRINT="$(sha256sum data/raw/fafb_v783/connections_princeton.csv.gz "$CENTROIDS" | sha256sum | cut -d" " -f1)"
          python scripts/run_fafb_npc_spatial_feasibility.py --connections data/raw/fafb_v783/connections_princeton.csv.gz --centroids "$CENTROIDS" --seed 20260935 --attempts ${{ inputs.attempts }} --target-accepted ${{ inputs.target_accepted }} --min-synapses 5 --checkpoint-every 5000000 --code-version "$CODE_VERSION" --input-fingerprint "$INPUT_FINGERPRINT" $RESUME_ARG --output artifacts/fafb-v783/c2-feasibility-${{ inputs.attempts }}.json
      - name: Upload C2 result and latest checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-c2-feasibility-${{ inputs.attempts }}
          path: |
            artifacts/fafb-v783/c2-feasibility-${{ inputs.attempts }}.json
            artifacts/fafb-v783/c2-state.pkl.gz
          if-no-files-found: warn
          retention-days: 90
