name: M2 FAFB reciprocity

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Download FAFB v783
        run: |
          mkdir -p data/raw/fafb_v783
          curl -L --fail --retry 3 -o data/raw/fafb_v783/connections_princeton.csv.gz \
            https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz
      - name: Run reciprocity analysis
        run: PYTHONPATH=. python scripts/run_fafb_reciprocity.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-reciprocity
          path: artifacts/fafb-v783/reciprocity.json
