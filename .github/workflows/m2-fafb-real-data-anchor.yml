name: FAFB v783 real-data anchor pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_fafb_profile.py"
      - "scripts/run_fafb_reciprocity.py"
      - "scripts/run_fafb_motif_sample.py"
      - "scripts/run_fafb_spatial_profile.py"
      - "scripts/run_fafb_rich_club.py"
      - "src/graph/**"
      - ".github/workflows/m2-fafb-real-data-anchor.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download FAFB v783
        run: |
          mkdir -p data/raw/fafb_v783
          curl -L --fail --retry 3 --output data/raw/fafb_v783/connections_princeton.csv.gz \
            "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Run structural profile
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v python scripts/run_fafb_profile.py
      - name: Run reciprocity
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v python scripts/run_fafb_reciprocity.py
      - name: Run spatial and neuropil inventory
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v python scripts/run_fafb_spatial_profile.py
      - name: Run rich-club benchmark
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v python scripts/run_fafb_rich_club.py \
            --min-synapses 5 \
            --nulls 2 \
            --swaps-per-edge 1.0 \
            --threshold-min 20 \
            --threshold-max 120 \
            --threshold-step 1
      - name: Run directed triad sample
        env:
          PYTHONPATH: .
        run: |
          /usr/bin/time -v python scripts/run_fafb_motif_sample.py \
            --samples 1000000 \
            --nulls 2
      - name: Upload real-data anchor artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-real-data-anchor
          path: artifacts/fafb-v783/
          if-no-files-found: error
