name: M2 FAFB canonical triad sample
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_fafb_motif_sample.py"
      - "src/graph/random_baseline.py"
      - ".github/workflows/m2-fafb-motif.yml"
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download FAFB v783
        run: |
          mkdir -p data/raw/fafb_v783
          curl -L --fail --retry 3 --output data/raw/fafb_v783/connections_princeton.csv.gz             "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Run canonical triad sample
        run: PYTHONPATH=. python scripts/run_fafb_motif_sample.py --samples 1000000 --nulls 4
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-canonical-triads
          path: artifacts/fafb-v783/motif-sample.json
