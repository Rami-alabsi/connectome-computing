name: FAFB v783 publication-aligned rich-club benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/run_fafb_rich_club.py"
      - "src/graph/random_baseline.py"
      - ".github/workflows/m2-fafb-rich-club-publication.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download FAFB v783
        run: |
          mkdir -p data/raw/fafb_v783
          curl -L --fail --retry 3 --output data/raw/fafb_v783/connections_princeton.csv.gz \
            "https://storage.googleapis.com/flywire-data/codex/data/fafb/783/connections_princeton.csv.gz"
      - name: Run publication-aligned benchmark
        run: |
          /usr/bin/time -v PYTHONPATH=. python scripts/run_fafb_rich_club.py \
            --min-synapses 5 \
            --nulls 2 \
            --swaps-per-edge 1.0 \
            --threshold-min 20 \
            --threshold-max 120 \
            --threshold-step 1
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-rich-club-publication-benchmark
          path: artifacts/fafb-v783/rich-club.json
