name: m6-cosmic-noise

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/simulator/noise_benchmark.py"
      - "scripts/run_m6_cosmic_noise.py"
      - "tests/test_noise_benchmark.py"
      - ".github/workflows/m6-cosmic-noise.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: PYTHONPATH=. python scripts/run_m6_cosmic_noise.py
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: m6-cosmic-noise
          path: results/m6-cosmic-noise.csv
