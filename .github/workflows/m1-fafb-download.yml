name: FAFB v783 download smoke test
on:
  push:
    paths:
      - 'scripts/download_fafb.py'
      - '.github/workflows/m1-fafb-download.yml'
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download FAFB v783 connection resource
        env:
          CODEX_API_TOKEN: ${{ secrets.CODEX_API_TOKEN }}
        run: python scripts/download_fafb.py
      - name: Inspect downloaded resource
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path
          p = Path("data/raw/fafb_v783/connections_princeton.csv.gz")
          with gzip.open(p, "rt", encoding="utf-8", newline="") as f:
              header = next(f).strip()
              first = next(f).strip()
          print("header:", header)
          print("first_row:", first)
          print("bytes:", p.stat().st_size)
          PY
      - name: Compare streamed counts with Codex reference
        run: |
          python - <<'PY'
          from src.graph.connections import summarize
          result = summarize("data/raw/fafb_v783/connections_princeton.csv.gz")
          print(result)
          # The published neuron count includes neurons with zero rows in the
          # connection table. Therefore the connection-derived node count is
          # expected to be smaller; the directed-pair count is the exact
          # graph-level invariant available from this resource.
          assert result["nodes"] == 138584, result
          assert result["unique_directed_pairs"] == 3732460, result
          assert result["edge_rows"] == 5342446, result
          assert result["multi_region_pair_rows"] == 1609986, result
          PY
      - name: Build FAFB structural profile
        run: python scripts/run_fafb_profile.py
      - name: Upload FAFB smoke-test artifact

        uses: actions/upload-artifact@v4
        with:
          name: fafb-v783-connections-smoke
          path: |
            data/raw/fafb_v783/connections_princeton.csv.gz
            data/raw/fafb_v783/connections_princeton.csv.gz.json
            artifacts/fafb-v783/profile.json
